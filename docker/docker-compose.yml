services:
  app:
    image: ${GEMKBR_IMAGE:-ghcr.io/rakhmamed/gemkbr:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      DOMAIN: gemkbr.ru
      PUBLIC_SITE_URL: https://gemkbr.ru
      DATABASE_PATH: /data/app.db
      DATA_DIR: /data
      PREVIEWS_DIR: /data/previews
      BETTER_AUTH_URL: https://gemkbr.ru
    volumes:
      - gemkbr_data:/data
    expose:
      - "4321"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4321/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  outbox-worker:
    image: ${GEMKBR_IMAGE:-ghcr.io/rakhmamed/gemkbr:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_PATH: /data/app.db
      DATA_DIR: /data
      PREVIEWS_DIR: /data/previews
      ORDER_NOTIFIER_MODE: console
    volumes:
      - gemkbr_data:/data
    command: ["./node_modules/.bin/tsx", "scripts/outbox-worker.ts"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  gemkbr_data:
  caddy_data:
  caddy_config:
